<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Informations</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body>
    <!-- navbar -->
    <div class="navbar bg-base-100 shadow-2xl mt-4 w-full mx-auto flex justify-between">
      <a class="btn btn-ghost text-xl">Information about cars</a>
      <div class="flex justify-end">
        <button class="btn dark__mode">🌙&nbsp;Dark</button>
        <button class="btn hidden light__mode">☀️&nbsp;Light</button>
      </div>
    </div>
    <template class="" id="ui_template">
      <div
        class="flex flex-col justify-center overflow-x-hidden p-6 mt-4 mb-10 border bg-transparent border-stone-700 w-75 m-w-75 mx-auto gap-3 rounded-md"
      >
        <div class="flex">
          <span class="text-yellow-700 font-bold">Name:&nbsp &nbsp</span>
          <h2 class="js-data-name"></h2>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Trim:&nbsp &nbsp</span>
          <p class="trim"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Generation:&nbsp &nbsp</span>
          <p class="generation"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Year:&nbsp</span>
          <p class="year"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold"> Colorname:&nbsp &nbsp</span>
          <p class="colorName"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Category:&nbsp &nbsp</span>
          <p class="category"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Door Count:&nbsp &nbsp</span>
          <p class="doorCount"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Seat count:&nbsp &nbsp</span>
          <p class="seatCount"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Max Speed:&nbsp &nbsp</span>
          <p class="maxSpeed"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold"
            >Acceleration:&nbsp &nbsp</span
          >
          <p class="acceleration"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Engine:&nbsp &nbsp</span>
          <p class="engine"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Horse Power:&nbsp &nbsp</span>
          <p class="horsePower"></p>
        </div>
        <div class="flex">
          <span class="text-yellow-700 font-bold">Fuel Type:&nbsp &nbsp</span>
          <p class="fuelType"></p>
        </div>
      </div>
    </template>

    <!-- Back button -->
    <div class="tooltip flex inline-block mt-10 ml-5" data-tip="Home page">
      <a href="/index.html"
        ><button class="btn btn-dash"><span>👈</span>Asosiy Sahifa</button></a
      >
    </div>

    <div class="js-details-box"></div>
    <script src="./js/mode.js"></script>
    <script src="./js/detail.js"></script>
  </body>
</html>
