<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon-32x32.png"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD</title>
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body class="overflow-x-hidden body">
    <!-- Navbar -->
    <div
      class="navbar bg-base-100 shadow-2xl mt-4 w-full mx-auto flex justify-between pr-4"
    >
      <a class="btn btn-ghost text-xl">Cars Information</a>
      <div class="flex gap-3">
        <div class="flex justify-end">
          <button class="btn btn-info js-add-button" >
            +Add
          </button>
        </div>
        <div class="flex justify-end">
          <button class="btn dark__mode">🌙&nbsp;Dark</button>
          <button class="btn hidden light__mode">☀️&nbsp;Light</button>
        </div>
      </div>
    </div>

    <!-- Container  -->
    <div
      class="grid grid-cols-1 w-full mx-auto justify-center items-center sm:grid-cols-2 gap-5 p-5 md:grid-cols-3 gap-4 p-5"
      id="container"
    ></div>

    <!-- Loader -->
    <div
      class="grid grid-cols-1 gap-5 p-5 sm:grid-cols-2 md:grid-cols-3"
      id="loader"
    ></div>

    <!-- Template fragment -->
    <template id="templateCard">
      <div
        class="card bg-base-100 shadow-sm w-62.5 m-w-62.5 mx-auto mt-10 hover:shadow-stone-700 transition-colors group"
      >
        <a href="#" class="js-data-link">
          <svg
            class="absolute t-5 right-5 opacity-0 pt-2 text-blue-300 group-hover:opacity-100 transition-opacity"
            width="30"
            height="30"
            viewBox="0 0 15 15"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M8.14645 3.14645C8.34171 2.95118 8.65829 2.95118 8.85355 3.14645L12.8536 7.14645C13.0488 7.34171 13.0488 7.65829 12.8536 7.85355L8.85355 11.8536C8.65829 12.0488 8.34171 12.0488 8.14645 11.8536C7.95118 11.6583 7.95118 11.3417 8.14645 11.1464L11.2929 8H2.5C2.22386 8 2 7.77614 2 7.5C2 7.22386 2.22386 7 2.5 7H11.2929L8.14645 3.85355C7.95118 3.65829 7.95118 3.34171 8.14645 3.14645Z"
              fill="currentColor"
              fill-rule="evenodd"
              clip-rule="evenodd"
            ></path>
          </svg>
        </a>
        <!-- <figure>
          <img
            src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp"
            alt="Shoes"
          />
        </figure> -->

        <div class="card-body">
          <h2 class="card-title"></h2>
          <p></p>
          <p id="generation"></p>
          <p id="year"></p>
          <div class="card-actions justify-end">
            <div class="flex gap-4">
              <div class="tooltip flex" data-tip="Tahrirlash">
                <button class="btn btn-info js-edit-button text-white">
                  <svg
                    class="pointer-events-none"
                    width="15"
                    height="15"
                    viewBox="0 0 15 15"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M12.1464 1.14645C12.3417 0.951184 12.6583 0.951184 12.8535 1.14645L14.8535 3.14645C15.0488 3.34171 15.0488 3.65829 14.8535 3.85355L10.9109 7.79618C10.8349 7.87218 10.7471 7.93543 10.651 7.9835L6.72359 9.94721C6.53109 10.0435 6.29861 10.0057 6.14643 9.85355C5.99425 9.70137 5.95652 9.46889 6.05277 9.27639L8.01648 5.34897C8.06455 5.25283 8.1278 5.16507 8.2038 5.08907L12.1464 1.14645ZM12.5 2.20711L8.91091 5.79618L7.87266 7.87267L8.12731 8.12732L10.2038 7.08907L13.7929 3.5L12.5 2.20711ZM9.99998 2L8.99998 3H4.9C4.47171 3 4.18056 3.00039 3.95552 3.01877C3.73631 3.03668 3.62421 3.06915 3.54601 3.10899C3.35785 3.20487 3.20487 3.35785 3.10899 3.54601C3.06915 3.62421 3.03669 3.73631 3.01878 3.95552C3.00039 4.18056 3 4.47171 3 4.9V11.1C3 11.5283 3.00039 11.8194 3.01878 12.0445C3.03669 12.2637 3.06915 12.3758 3.10899 12.454C3.20487 12.6422 3.35785 12.7951 3.54601 12.891C3.62421 12.9309 3.73631 12.9633 3.95552 12.9812C4.18056 12.9996 4.47171 13 4.9 13H11.1C11.5283 13 11.8194 12.9996 12.0445 12.9812C12.2637 12.9633 12.3758 12.9309 12.454 12.891C12.6422 12.7951 12.7951 12.6422 12.891 12.454C12.9309 12.3758 12.9633 12.2637 12.9812 12.0445C12.9996 11.8194 13 11.5283 13 11.1V6.99998L14 5.99998V11.1V11.1207C14 11.5231 14 11.8553 13.9779 12.1259C13.9549 12.407 13.9057 12.6653 13.782 12.908C13.5903 13.2843 13.2843 13.5903 12.908 13.782C12.6653 13.9057 12.407 13.9549 12.1259 13.9779C11.8553 14 11.5231 14 11.1207 14H11.1H4.9H4.87934C4.47686 14 4.14468 14 3.87409 13.9779C3.59304 13.9549 3.33469 13.9057 3.09202 13.782C2.7157 13.5903 2.40973 13.2843 2.21799 12.908C2.09434 12.6653 2.04506 12.407 2.0221 12.1259C1.99999 11.8553 1.99999 11.5231 2 11.1207V11.1206V11.1V4.9V4.87935V4.87932V4.87931C1.99999 4.47685 1.99999 4.14468 2.0221 3.87409C2.04506 3.59304 2.09434 3.33469 2.21799 3.09202C2.40973 2.71569 2.7157 2.40973 3.09202 2.21799C3.33469 2.09434 3.59304 2.04506 3.87409 2.0221C4.14468 1.99999 4.47685 1.99999 4.87932 2H4.87935H4.9H9.99998Z"
                      fill="currentColor"
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                </button>
              </div>
              <div class="tooltip flex" data-tip="Delete">
                <button class="btn btn-error js-delete-button" id="delBtn">
                  <svg
                    class="text-white pointer-events-none"
                    width="15"
                    height="15"
                    viewBox="0 0 15 15"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M5.5 1C5.22386 1 5 1.22386 5 1.5C5 1.77614 5.22386 2 5.5 2H9.5C9.77614 2 10 1.77614 10 1.5C10 1.22386 9.77614 1 9.5 1H5.5ZM3 3.5C3 3.22386 3.22386 3 3.5 3H5H10H11.5C11.7761 3 12 3.22386 12 3.5C12 3.77614 11.7761 4 11.5 4H11V12C11 12.5523 10.5523 13 10 13H5C4.44772 13 4 12.5523 4 12V4L3.5 4C3.22386 4 3 3.77614 3 3.5ZM5 4H10V12H5V4Z"
                      fill="currentColor"
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- skeleton -->
    <template id="templateSkeleton">
      <div
        class="card bg-base-100 shadow-sm w-62.5 m-w-62.5 mr-auto ml-auto mt-10"
      >
        <div class="card-body">
          <div class="skeleton h-6.5 w-50.5"></div>
          <div class="flex flex-col gap-2">
            <div class="skeleton h-5 w-5"></div>
            <div class="skeleton h-5 w-10"></div>
            <div class="skeleton h-5 w-10"></div>
          </div>
          <div class="card-actions justify-end">
            <div class="skeleton h-10 w-16.75"></div>
            <div class="skeleton h-10 w-12"></div>
          </div>
        </div>
      </div>
    </template>

    <!-- Toast -->

    <template id="toastTemplate">
      <div role="alert" class="alert alert-error alert-soft">
        <span></span>
      </div>
    </template>
    <div class="fixed top-5 right-5 flex flex-col gap-2" id="toast"></div>
    <!-- buttons Prev & Next -->
    <div
      class="gap-10 pl-4 pt-4 justify-center mt-5 mb-5 hidden"
      id="pagenation"
    >
      <div class="tooltip flex" data-tip="back ">
        <button
          class="btn-info bg-blue-500 p-2 pr-4 pl-4 rounded-md cursor-pointer hover:bg-gray-600 hover:color-white hidden"
          id="prev"
        >
          <span>👈</span>Prev
        </button>
      </div>
      <div class="tooltip flex" data-tip="next page">
        <button
          class="btn-info bg-blue-500 p-2 pr-4 pl-4 rounded-md cursor-pointer hover:bg-gray-600 hover:color-white"
          id="next"
        >
          Next <span>👉</span>
        </button>
      </div>
    </div>

    <!-- +add Modal -->
    <dialog id="editModal" class="modal">
      <div
        class="modal-box h-70 flex flex-col overflow-y-scroll sm:h-120 md:h-120 mx-auto"
      >
        <form method="dialog">
          <button
            class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
          >
            ✕
          </button>
        </form>
        <h3 class="text-lg font-bold">Yangi mashina qo'shish</h3>
        <p class="py-4">Mashina haqidagi malumotlarni kiriting!</p>
        <form class="flex flex-col gap-y-2" id="carAddForm">
          <input
            type="text"
            placeholder="Mashina nomini kiriting"
            class="input"
            id="js-car-name"
            name="name"
          />
          <input
            type="number"
            max="2030"
            min="1990"
            placeholder="Mashina chiqarilgan yilini kiriting"
            class="input"
            id="js-car-year"
            name="year"
          />
          <div class="flex gap-1">
            <h3>Rang:</h3>
            <input
              type="color"
              placeholder="Mashina rangini kiriting "
              id="js-car-color"
              name="color"
            />
          </div>
          <label class="input">
            <input
              type="number"
              min="80"
              placeholder="Mashina max tezligini kiriting"
              id="js-car-speed"
              name="maxSpeed"
            />
            km/s
          </label>
          <input
            type="number"
            max="1500"
            min="40"
            placeholder="Mashinadagi ot kuchi"
            class="input"
            id="js-car-horsePower"
            name="horsepower"
          />
          <input
            type="text"
            placeholder="Mashina avlodini kiriting"
            class="input"
            id="js-car-generation"
            name="generation"
          />
          <input
            type="text"
            placeholder="Mashina modelini kiriting"
            class="input"
            id="js-car-category"
            name="category"
          />

          <input
            type="number"
            max="6"
            min="2"
            placeholder="Mashinadagi eshiklar sonini kiriting"
            class="input"
            id="js-car-doorCount"
            name="doorCount"
          />
          <input
            type="number"
            max="10"
            min="2"
            placeholder="Mashinadagi orindiqlar sonini kiriting"
            class="input"
            id="js-car-seatCount"
            name="seatCount"
          />
          <input
            type="number"
            max="20"
            min="2"
            placeholder="Mashina  tezligi 0-100 ?sek"
            class="input"
            id="js-car-acceleration"
            name="acceleration"
          />
          <input
            type="text"
            placeholder="Yoqilgi turini kiriting "
            class="input"
            id="js-car-fuelType"
            name="fuelType"
          />
          <input
            type="text"
            placeholder="Mashina ishlab chiqarilgan davlat "
            class="input"
            id="js-car-country"
            name="country"
          />
          <textarea
            placeholder="Mashina haqida qisqacha ta'rif"
            class="w-full pl-3 hover:border-s-gray-400"
            id="js-car-description"
            name="description"
          ></textarea>
          <button value="submit" class="w-full btn mt-2" id="addSubmit">
            Tasdiqlash
          </button>
        </form>
      </div>
    </dialog>
    <!-- edit modal -->
    <dialog id="editModal" class="modal">
      <div class="modal-box">
        <form method="dialog">
          <button
            class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
          >
            ✕
          </button>
        </form>
        <h3 class="text-lg font-bold">
          O'zingizga yoqgan mashina malumotlarini kiritishingiz mumkun
        </h3>
        <p class="py-4">Bu yerdagi malumotlarni o'zgartiring</p>
        <form class="flex flex-col gap-y-2" id="carEditForm">
          <input
            type="text"
            placeholder="Mashina nomini kiriting"
            class="input"
            id="js-car-name"
            name="name"
          />
          <input
            type="number"
            max="2030"
            min="1990"
            placeholder="Mashina chiqarilgan yilini kiriting"
            class="input"
            id="js-car-year"
            name="year"
          />
          <div class="flex gap-1">
            <h3>Rang:</h3>
            <input
              type="color"
              placeholder="Mashina rangini kiriting "
              id="js-car-color"
              name="color"
            />
          </div>
          <label class="input">
            <input
              type="number"
              min="80"
              placeholder="Mashina max tezligini kiriting"
              id="js-car-speed"
              name="maxSpeed"
            />
            km/s
          </label>
          <input
            type="number"
            max="1500"
            min="40"
            placeholder="Mashinadagi ot kuchi"
            class="input"
            id="js-car-horsePower"
            name="horsepower"
          />
          <input
            type="text"
            placeholder="Mashina avlodini kiriting"
            class="input"
            id="js-car-generation"
            name="generation"
          />
          <input
            type="text"
            placeholder="Mashina modelini kiriting"
            class="input"
            id="js-car-category"
            name="category"
          />

          <input
            type="number"
            max="6"
            min="2"
            placeholder="Mashinadagi eshiklar sonini kiriting"
            class="input"
            id="js-car-doorCount"
            name="doorCount"
          />
          <input
            type="number"
            max="10"
            min="2"
            placeholder="Mashinadagi orindiqlar sonini kiriting"
            class="input"
            id="js-car-seatCount"
            name="seatCount"
          />
          <input
            type="number"
            max="20"
            min="2"
            placeholder="Mashina  tezligi 0-100 ?sek"
            class="input"
            id="js-car-acceleration"
            name="acceleration"
          />
          <input
            type="text"
            placeholder="Yoqilgi turini kiriting "
            class="input"
            id="js-car-fuelType"
            name="fuelType"
          />
          <input
            type="text"
            placeholder="Mashina ishlab chiqarilgan davlat "
            class="input"
            id="js-car-country"
            name="country"
          />
          <textarea
            placeholder="Mashina haqida qisqacha ta'rif"
            class="w-full pl-3 hover:border-s-gray-400"
            id="js-car-description"
            name="description"
          ></textarea>
          <button value="submit" class="w-full btn mt-2" id="addSubmit">
            Tasdiqlash
          </button>
        </form>
      </div>
    </dialog>
    <script type="module" src="./js/mode.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
